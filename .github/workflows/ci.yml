name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck rotate_logs.sh
      - name: Smoke test rotation
        run: |
          chmod +x rotate_logs.sh
          ./rotate_logs.sh sample/app.log 50
